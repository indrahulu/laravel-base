services:
  web:
    image: ${IMAGE:?IMAGE is required, e.g. IMAGE=indrahulu/laravel-base:php8.3}
    ports:
      - "${WEB_HTTP_PORT:-18080}:8080"
      - "${WEB_HTTPS_PORT:-18443}:8443"
    environment:
      APP_ROLE: web
    volumes:
      - ./fixture-app:/var/www/html
    restart: "no"

  web-upload-override:
    image: ${IMAGE:?IMAGE is required, e.g. IMAGE=indrahulu/laravel-base:php8.3}
    environment:
      APP_ROLE: web
      NGINX_CLIENT_MAX_BODY_SIZE: 500g
    ports: []
    volumes:
      - ./fixture-app:/var/www/html
    restart: "no"

  timezone:
    profiles: [checks]
    image: ${IMAGE:?IMAGE is required, e.g. IMAGE=indrahulu/laravel-base:php8.3}
    environment:
      APP_ROLE: web
      TZ: Etc/UTC
    volumes:
      - ./fixture-app:/var/www/html
    restart: "no"

  worker:
    image: ${IMAGE:?IMAGE is required, e.g. IMAGE=indrahulu/laravel-base:php8.3}
    environment:
      APP_ROLE: worker
      QUEUE_CONNECTION: redis
      QUEUE_NAMES: default
      QUEUE_CONCURRENCY: "3"
    depends_on:
      redis:
        condition: service_started
    volumes:
      - ./fixture-app:/var/www/html
    restart: "no"

  scheduler:
    image: ${IMAGE:?IMAGE is required, e.g. IMAGE=indrahulu/laravel-base:php8.3}
    environment:
      APP_ROLE: scheduler
    volumes:
      - ./fixture-app:/var/www/html
    restart: "no"

  all:
    image: ${IMAGE:?IMAGE is required, e.g. IMAGE=indrahulu/laravel-base:php8.3}
    ports:
      - "${ALL_HTTP_PORT:-28080}:8080"
      - "${ALL_HTTPS_PORT:-28443}:8443"
    environment:
      APP_ROLE: all
      QUEUE_CONNECTION: redis
      QUEUE_NAMES: default
      QUEUE_CONCURRENCY: "3"
    depends_on:
      redis:
        condition: service_started
    volumes:
      - ./fixture-app:/var/www/html
    restart: "no"

  all-no-queue:
    image: ${IMAGE:?IMAGE is required, e.g. IMAGE=indrahulu/laravel-base:php8.3}
    environment:
      APP_ROLE: all
      QUEUE_ENABLED: "false"
    ports: []
    volumes:
      - ./fixture-app:/var/www/html
    restart: "no"

  redis:
    image: redis:7-alpine
    restart: "no"
